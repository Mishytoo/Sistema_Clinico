<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title th:text="'Sistema clinico - ' + ${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
    <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">-->




    <style>
        body {
            min-height: 100vh;
            background-color: #ffffff;
        }

        .app-topbar {
            min-height: 42px;
            padding: 0.35rem 1rem;
        }

        .app-wrapper {
            display: flex;
            min-height: calc(100vh - 42px);
        }

        .app-sidebar {
            width: 285px;
            min-width: 285px;
            border-right: 1px solid #dee2e6;
            background-color: #f8f9fa;
            overflow-y: auto;
        }

        .app-content {
            flex: 1;
            padding: 1.5rem;
            overflow-x: auto;
        }

        .sidebar-user {
            font-size: 0.85rem;
            font-weight: bold;
        }

        .sidebar-accordion .card {
            border-radius: 0;
            border-left: 0;
            border-right: 0;
        }

        .sidebar-accordion .card-header {
            padding: 0;
        }

        .sidebar-accordion .btn-link {
            text-decoration: none;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
        }

        .sidebar-accordion .btn-link:hover {
            text-decoration: none;
        }

        .sidebar-item {
            font-size: 0.85rem;
        }

        .content-panel {
            min-height: calc(100vh - 120px);
        }
    </style>

</head>
<body>
<header th:fragment="publicHeader">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <a class="navbar-brand" href="#">Sistema Clinico</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" aria-label="Toogle navitagion">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-warning" th:if="${warning}" th:text="${warning}"></div>
    <div class="alert alert-info" th:if="${info}" th:text="${info}"></div>
</header>

<header th:fragment="appTopbar">
<!--    <nav class="navbar navbar-dark bg-dark app-topbar">-->
    <nav class="navbar navbar-dark app-topbar" th:classappend="${claseRol}">
        <div class="d-flex align-items-left text-white">
            <span class="mr-3">
                <strong th:text="${username}">Usuario</strong>
<!--                <span class="badge badge-info ml-1" th:text="${tipoUsuario}">Rol</span>-->
                <span class="badge ml-1" th:classappend="${badgeRol}" th:text="${tipoUsuario}">Rol</span>
            </span>
        </div>
        <div class="d-flex align-items-center text-white">
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-sm btn-outline-danger">
<!--                        th:classappend="${badgeRol == 'badge-secondary' ? 'btn-outline-secondary' : 'btn-outline-danger'}">-->
                    Cerrar sesión
                </button>
            </form>
        </div>
    </nav>

    <div class="alert alert-success mb-0" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger mb-0" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-warning mb-0" th:if="${warning}" th:text="${warning}"></div>
    <div class="alert alert-info mb-0" th:if="${info}" th:text="${info}"></div>
</header>

<aside th:fragment="sidebar" class="app-sidebar">

    <div th:if="${#lists.isEmpty(menuGrupos)}" class="alert alert-warning m-3">
        Este usuario no tiene menús asignados.
    </div>

    <div class="accordion sidebar-accordion" id="menuAccordion" th:if="${not #lists.isEmpty(menuGrupos)}">

        <div class="card" th:each="grupo, iterGrupo : ${menuGrupos}">

<!--            <div class="card-header bg-dark" th:id="'headingGrupo' + ${grupo.id}">-->
            <div class="card-header" th:classappend="${claseRol}" th:id="'headingGrupo' + ${grupo.id}">

<!--                th:classappend="${codigoRol == 'LABORATORIO'} ? ' text-dark' : ' text-white'"-->
                <button class="btn btn-link text-left text-white"
                        type="button"
                        data-toggle="collapse"
                        th:data-target="'#collapseGrupo' + ${grupo.id}"
                        th:aria-controls="'collapseGrupo' + ${grupo.id}"
                        th:aria-expanded="${@menuHelper.grupoActivo(grupo, currentPath)}">
<!--                    th:aria-expanded="${iterGrupo.index == 0}"-->

                    <i th:if="${grupo.icono != null}" th:class="${grupo.icono}"></i>
                    <span th:text="${grupo.nombre}">Grupo</span>
                </button>
            </div>

<!--            th:classappend="${iterGrupo.index == 0} ? ' show'"-->
            <div class="collapse"
                 th:classappend="${@menuHelper.grupoActivo(grupo, currentPath)} ? ' show'"
                 th:id="'collapseGrupo' + ${grupo.id}"
                 th:aria-labelledby="'headingGrupo' + ${grupo.id}"
                 data-parent="#menuAccordion">

                <div class="card-body p-2">
<!--                    th:href="@{|/${item.categoria}/${item.valor}|}"-->
<!--                    th:href="${#strings.isEmpty(item.categoria)} ? @{|/${item.valor}|}
                                    : @{|/${item.categoria}/${item.valor}|}"-->
                    <a th:each="item : ${grupo.items}"
                       th:href="@{${@menuHelper.url(item)}}"
                       th:classappend="${@menuHelper.itemActivo(item, currentPath)} ? ' active'"
                       class="btn btn-outline-primary btn-sm d-block text-left mb-2 sidebar-item">

                        <i th:if="${item.icono != null}" th:class="${item.icono}"></i>
                        <span th:text="${item.nombre}">Submenú</span>
                    </a>

                </div>
            </div>

        </div>
    </div>
</aside>


<div class="container">
</div>

<footer th:fragment="footer" class="container">
    <hr/>
    <img th:src="@{/images/spring.png}" alt="Spring logo"/>
    <p>
        Powered by <a href="https://projects.spring.io/spring-boot/">Spring
        Boot</a> y <a href="http://www.thymeleaf.org">Thymeleaf</a>.
    </p>
    <p>
        Este proyecto fue desarrollado en IDE Intellij + Spring + Hibernate + JPA + Thymeleaf.<br/> &copy; Company 2026,
        Inc. Todos los derechos reservados. Términos de uso y privacidad.<br/>
    </p>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Bootstrap JS -->
    <script th:src="@{/js/jquery-3.3.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/jquery-ui.min.js}"></script>

</footer>

<div th:fragment="scripts">
    <script th:src="@{/js/jquery-3.3.1.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/jquery-ui.min.js}"></script>
</div>


</body>

</html>

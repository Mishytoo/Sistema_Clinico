<div class="app-wrapper">
    <aside th:replace="layout/layout :: sidebar"></aside>
    <main class="app-content">
        <div class="card bg-light content-panel">
            <div class="card-header">
                <h4 class="mb-0" th:text="${titulo}"></h4>
            </div>

            <div class="card-body">
                <form th:action="@{/persona/regPer}" th:object="${persona}" method="post">
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Tipo Documento</label>
                        <div class="col-sm-6">
                            <input type="text" th:field="*{tipoDocumento}" class="form-control"/>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Nro Documento</label>
                        <div class="col-sm-6">
                            <input type="text" th:field="*{nroDocumento}" class="form-control"/>
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('nroDocumento')}"
                                   th:errors="*{nroDocumento}"></small>
                            <!--<small class="form-text text-danger"
                                   th:if="${#fields.hasErrors('nroDocumento')}"
                                   th:text="${#fields.errors('nroDocumento')[0]}"></small>-->
                        </div>

                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Nombre Completo</label>
                        <div class="col-sm-6">
                            <input type="text" th:field="*{nombreCompleto}" class="form-control"/>
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('nombreCompleto')}"
                                   th:errors="*{nombreCompleto}"></small>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Apellido Completo</label>
                        <div class="col-sm-6">
                            <input type="text" th:field="*{apellidoCompleto}" class="form-control"/>
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('apellidoCompleto')}"
                                   th:errors="*{apellidoCompleto}"></small>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Sexo</label>
                        <div class="col-sm-6">
                            <input type="text" th:field="*{sexo}" class="form-control"/>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Celular</label>
                        <div class="col-sm-6">
                            <input type="text" th:field="*{celular}" class="form-control"/>
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('celular')}"
                                   th:errors="*{celular}"></small>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Fecha de Nacimiento</label>
                        <div class="col-sm-6">
                            <input type="text" th:field="*{fechaNacimiento}" class="form-control"/>
                            <small class="form-text text-danger" th:if="${#fields.hasErrors('fechaNacimiento')}"
                                   th:errors="*{fechaNacimiento}"></small>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-2 col-form-label">Direccion (Opcional)</label>
                        <div class="col-sm-6">
                            <input type="text" th:field="*{direccion}" class="form-control"/>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-sm-6">
                            <input type="submit" value="Procesar" class="btn btn-secondary"/>
                            <a class="btn btn-secondary"
                               th:href="@{/persona/listarPer}"
                               th:text="'volver'"></a>
                        </div>
                    </div>

            </div>


        </div>

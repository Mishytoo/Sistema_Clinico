<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Personas</title>
</head>
<body>
    <h1>Formulario de Persona</h1>
    <form th:object="${persona}" th:action="${accion}" method="post">
        <input type="hidden" th:field="*{id}">
        <label>Nombre Completo: <input type="text" th:field="*{nombreCompleto}"/> </label> <br/>
        <label>Apellido Completo: <input type="text" th:field="*{apellidoCompleto}"/> </label> <br/>
        <label>Tipo Documento:
            <select th:field="*{tipoDocumento}">
                <option value=""> -- Seleccione --</option>
                <option value="DNI">DNI</option>
                <option value="DNI Extranjero">DNI Extranjero</option>
            </select>
        </label><br/>
        <label>Numero de documento: <input type="text" th:field="*{nroDocumento}"/> </label> <br/>
        <label>Sexo:
            <select th:field="*{sexo}">
                <option value=""> -- Seleccione --</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
            </select>
        </label><br/>
        <label>Celular: <input type="text" th:field="*{celular}"/> </label> <br/>
        <label>Fecha de Nacimiento: <input type="date" th:field="*{fechaNacimiento}"/> </label> <br/>
        <label>Dirección:
            <textarea th:field="*{direccion}"></textarea>
        </label> <br/>

        <button type="submit">Guardar</button>
    </form>

    <a href="/personas">Volver a listado de personas</a>

</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/layout :: head">
    <!--<meta charset="UTF-8" />
    <title th:text="${titulo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">-->
</head>
<body>
<header th:replace="layout/layout :: appTopbar"></header>
<div class="app-wrapper">
    <aside th:replace="layout/layout :: sidebar"></aside>
    <main class="app-content">
        <div class="card bg-light content-panel">
            <div class="card-header">
                <h4 class="mb-0" th:text="${titulo}"></h4>
            </div>


            <div class="card-body">
                <h4 class="card-title">
                    <a th:href="@{/usuario/formUsu}" class="btn btn-secondary btn-xs">registrar</a>
                </h4>
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>

                        <th>fechaCreacion</th>
                        <th>horaCreacion</th>
                        <th>Cedula</th>
                        <th>Perteneciente</th>
                        <th>Sector</th>
                        <th>Accion</th>
                        <th>Accion</th>

                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td th:text="${u.nomUsuario}"></td>

                        <td th:text="${u.fechaCreacion}"></td>
                        <td th:text="${u.horaCreacion}"></td>
                        <td th:text="${u.persona.nroDocumento}"></td>
                        <td th:text="${u.persona.nombreCompleto + ' ' + u.persona.apellidoCompleto}"></td>
                        <td th:text="${u.tipoUsuario.tipoUsuario}"></td>
                        <td>
                            <a href="#" th:text="'editar'" class="btn btn-primary btn-xs"></a>
                        </td>
                        <td>
                            <a th:href="@{/usuario/delUsu/}+${u.id}" th:text="'eliminar'"
                               class="btn btn-danger btn-xs"
                               onclick="return confirm('¿Estas seguro que quieres eliminar?');">Eliminar</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <nav th:replace="paginator-nav :: paginator"></nav>
            </div>


        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
-->

<div th:replace="layout/layout :: scripts"></div>
</body>

</html>

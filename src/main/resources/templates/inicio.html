<div class="app-wrapper">

    <aside th:replace="layout/layout :: sidebar"></aside>

    <main class="app-content">

        <div class="card bg-light content-panel">

            <div class="card-header">
                <h4 class="mb-0" th:text="${titulo}">Menú principal</h4>
            </div>

            <div class="card-body">

                <div class="alert alert-info">
                    Bienvenido,
                    <strong th:text="${username}"></strong>
                    <span class="badge badge-secondary ml-2" th:text="${tipoUsuario}"></span>
                </div>

                <div class="row">

                    <div class="col-md-12">
                        <div class="card shadow-sm">
                            <div class="card-header bg-dark text-white">
                                Panel principal
                            </div>
                            <div class="card-body">
                                <p class="mb-0">
                                    Seleccione una opción del menú lateral para comenzar.
                                </p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<div th:replace="layout/layout :: scripts"></div>
<!--<footer th:replace="layout/layout :: footer"></footer>-->

</body>
</html>

spring.application.name=sistema_clinico
spring.datasource.url=jdbc:mysql://localhost:3306/bd_prueba?useSSL=false&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Automaticamente ejecutara la aplicacion
spring.jpa.hibernate.ddl-auto=update
# Indica cuando aplico una cosulta en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#lenguaje
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect